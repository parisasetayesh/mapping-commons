<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img"><title>Test the boundary, not only the easy cases</title><desc>A fictional rectangle contains one point; a second point lies exactly on the right boundary and a third is outside. Whether the boundary point matches depends on the chosen predicate.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#151b35"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#151b35;font-size:22px}.small{font-size:18px}.title{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}</style><rect width="1000" height="460" fill="white"/><text x="35" y="52" class="title">Test the boundary, not only the easy cases</text><rect x="110" y="115" width="390" height="275" fill="#eef3f8" stroke="#151b35" stroke-width="3"/><circle cx="245" cy="220" r="11" fill="#151b35"/><circle cx="500" cy="310" r="11" fill="#c24d3c"/><circle cx="700" cy="180" r="11" fill="#151b35"/><text x="200" y="260">Inside</text><text x="525" y="320">On the boundary</text><text x="730" y="185">Outside</text><text x="115" y="425" class="small">Specify the predicate: the boundary point is the test case.</text></svg>