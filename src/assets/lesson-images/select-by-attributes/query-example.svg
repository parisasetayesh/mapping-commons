<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img"><title>A condition is tested against every record</title><desc>Fictional records A active 12 and C active 10 satisfy active AND count at least 10. B inactive 15, D active 9, and E active with missing count are excluded.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#151b35"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#151b35;font-size:22px}.small{font-size:18px}.title{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}</style><rect width="1000" height="460" fill="white"/><text x="35" y="52" class="title">A condition is tested against every record</text><text x="50" y="105" class="label">Active AND count ≥ 10</text><rect x="45" y="125" width="900" height="48" fill="#f7e998"/><text x="65" y="157">A</text><text x="175" y="157">active</text><text x="465" y="157">12</text><text x="755" y="157">include</text><rect x="45" y="179" width="900" height="48" fill="#f2f3f5"/><text x="65" y="211">B</text><text x="175" y="211">inactive</text><text x="465" y="211">15</text><text x="755" y="211">exclude</text><rect x="45" y="233" width="900" height="48" fill="#f7e998"/><text x="65" y="265">C</text><text x="175" y="265">active</text><text x="465" y="265">10</text><text x="755" y="265">include</text><rect x="45" y="287" width="900" height="48" fill="#f2f3f5"/><text x="65" y="319">D</text><text x="175" y="319">active</text><text x="465" y="319">9</text><text x="755" y="319">exclude</text><rect x="45" y="341" width="900" height="48" fill="#f2f3f5"/><text x="65" y="373">E</text><text x="175" y="373">active</text><text x="465" y="373">missing</text><text x="755" y="373">exclude</text></svg>