<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img"><title>A spatial rule becomes a target-level summary</title><desc>Two fictional district polygons contain two points in A and one in B. A one-to-one spatial summary has one row per district with counts 2 and 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#151b35"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#151b35;font-size:22px}.small{font-size:18px}.title{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}</style><rect width="1000" height="460" fill="white"/><text x="35" y="52" class="title">A spatial rule becomes a target-level summary</text><rect x="45" y="130" width="220" height="240" fill="#eef3f8" stroke="#151b35"/><rect x="265" y="130" width="220" height="240" fill="#f7e998" stroke="#151b35"/><text x="100" y="170">District A</text><text x="310" y="170">District B</text><circle cx="105" cy="240" r="10" fill="#151b35"/><circle cx="180" cy="295" r="10" fill="#151b35"/><circle cx="350" cy="230" r="10" fill="#151b35"/><path d="M505 245L560 245" stroke="#151b35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="580" y="160" width="370" height="70" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="765.0" y="203.0" text-anchor="middle">A: 2 matching points</text><rect x="580" y="270" width="370" height="70" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="765.0" y="313.0" text-anchor="middle">B: 1 matching point</text><text x="45" y="423" class="small">Fictional example: polygons are targets; points supply the matches.</text></svg>