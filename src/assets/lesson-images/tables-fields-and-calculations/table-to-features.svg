<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img"><title>From records to locations</title><desc>An ID/X/Y table plus a known coordinate reference system becomes point features. Before import check types, order, units and missing coordinates; afterward check counts, locations, IDs and exclusions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#151b35"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#151b35;font-size:22px}.small{font-size:18px}.title{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}</style><rect width="1000" height="460" fill="white"/><text x="35" y="52" class="title">From records to locations</text><rect x="30" y="120" width="290" height="95" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="175.0" y="175.5" text-anchor="middle">Table: ID, X, Y</text><path d="M325 167L375 167" stroke="#151b35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="385" y="120" width="250" height="95" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="510.0" y="175.5" text-anchor="middle">Known reference</text><path d="M640 167L690 167" stroke="#151b35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="700" y="120" width="265" height="95" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="832.5" y="175.5" text-anchor="middle">Point features</text><text x="40" y="280">Before import: field types, order, units, missing coordinates</text><text x="40" y="335">After import: count, location, identifiers, excluded rows</text><text x="40" y="397" class="small">A coordinate pair needs documented meaning before it can locate a place.</text></svg>