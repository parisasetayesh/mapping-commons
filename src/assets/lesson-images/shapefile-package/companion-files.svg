<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img"><title>Several files, one dataset</title><desc>Four companion files with one basename: .shp geometry, .shx index, .dbf attributes, and .prj coordinate-reference information. The first three are core components.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#151b35"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#151b35;font-size:22px}.small{font-size:18px}.title{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}</style><rect width="1000" height="460" fill="white"/><text x="35" y="52" class="title">Several files, one dataset</text><rect x="35" y="145" width="205" height="115" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="137.5" y="210.5" text-anchor="middle">.shp</text><text x="138" y="315" text-anchor="middle">Geometry</text><rect x="277" y="145" width="205" height="115" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="379.5" y="210.5" text-anchor="middle">.shx</text><text x="380" y="315" text-anchor="middle">Index</text><rect x="519" y="145" width="205" height="115" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="621.5" y="210.5" text-anchor="middle">.dbf</text><text x="622" y="315" text-anchor="middle">Attributes</text><rect x="761" y="145" width="205" height="115" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="863.5" y="210.5" text-anchor="middle">.prj</text><text x="864" y="315" text-anchor="middle">Reference</text><text x="35" y="397">One shared basename. Keep the companion files together.</text></svg>