<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img"><title>Inspect before repeating</title><desc>Inspect → Validate → Try one → Check → Repeat. A loop repeats assumptions as efficiently as it repeats instructions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#151b35"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#151b35;font-size:22px}.small{font-size:18px}.title{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}</style><rect width="1000" height="460" fill="white"/><text x="35" y="52" class="title">Inspect before repeating</text><rect x="28" y="150" width="168" height="110" fill="#f7e998" stroke="#151b35" stroke-width="2"/><text x="112.0" y="213.0" text-anchor="middle">Inspect</text><path d="M199 205L219 205" stroke="#151b35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="224" y="150" width="168" height="110" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="308.0" y="213.0" text-anchor="middle">Validate</text><path d="M395 205L415 205" stroke="#151b35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="420" y="150" width="168" height="110" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="504.0" y="213.0" text-anchor="middle">Try one</text><path d="M591 205L611 205" stroke="#151b35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="616" y="150" width="168" height="110" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="700.0" y="213.0" text-anchor="middle">Check</text><path d="M787 205L807 205" stroke="#151b35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="812" y="150" width="168" height="110" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="896.0" y="213.0" text-anchor="middle">Repeat</text><text x="35" y="330">A loop repeats assumptions as efficiently as it repeats instructions.</text><text x="35" y="380" class="small">Read each arrow as a choice that must be documented and checked.</text></svg>