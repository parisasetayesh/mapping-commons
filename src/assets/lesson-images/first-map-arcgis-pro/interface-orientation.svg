<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img"><title>Find the role before looking for the button</title><desc>Simplified interface schematic: ribbon across the top, Contents at left, map view in the middle, and Catalog or other panes at right. This is an orientation diagram, not a software screenshot.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#151b35"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#151b35;font-size:22px}.small{font-size:18px}.title{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}</style><rect width="1000" height="460" fill="white"/><text x="35" y="52" class="title">Find the role before looking for the button</text><rect x="30" y="105" width="935" height="60" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="497.5" y="143.0" text-anchor="middle">Ribbon: commands grouped by task</text><rect x="30" y="180" width="210" height="230" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="135.0" y="303.0" text-anchor="middle">Contents</text><rect x="255" y="180" width="450" height="230" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="480.0" y="303.0" text-anchor="middle">Map view</text><rect x="720" y="180" width="245" height="230" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="842.5" y="303.0" text-anchor="middle">Catalog / panes</text></svg>