<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img"><title>A folder structure with a purpose</title><desc>A working parent folder connects to Sources, Working data, Outputs, and Documentation. Originals are preserved and a consistent backup is tested.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#151b35"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#151b35;font-size:22px}.small{font-size:18px}.title{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}</style><rect width="1000" height="460" fill="white"/><text x="35" y="52" class="title">A folder structure with a purpose</text><rect x="350" y="105" width="300" height="70" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="500.0" y="148.0" text-anchor="middle">Working project</text><path d="M500 176L135 280" stroke="#151b35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="285" width="210" height="75" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="135.0" y="330.5" text-anchor="middle">Sources</text><path d="M500 176L380 280" stroke="#151b35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="275" y="285" width="210" height="75" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="380.0" y="330.5" text-anchor="middle">Working data</text><path d="M500 176L625 280" stroke="#151b35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="520" y="285" width="210" height="75" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="625.0" y="330.5" text-anchor="middle">Outputs</text><path d="M500 176L870 280" stroke="#151b35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="765" y="285" width="210" height="75" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="870.0" y="330.5" text-anchor="middle">Documentation</text><text x="35" y="420" class="small">Preserve originals. Test a consistent backup outside the active workspace.</text></svg>