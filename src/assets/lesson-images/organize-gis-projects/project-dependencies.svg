<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img"><title>Views and data are connected, not identical</title><desc>A project has a map and a data-container connection. The map has a layer; the container holds a feature class. The layer references the feature class.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#151b35"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#151b35;font-size:22px}.small{font-size:18px}.title{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}</style><rect width="1000" height="460" fill="white"/><text x="35" y="52" class="title">Views and data are connected, not identical</text><rect x="340" y="100" width="320" height="65" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="500.0" y="140.5" text-anchor="middle">Project</text><rect x="85" y="220" width="240" height="70" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="205.0" y="263.0" text-anchor="middle">Map</text><rect x="665" y="220" width="250" height="70" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="790.0" y="263.0" text-anchor="middle">Data container</text><rect x="85" y="345" width="240" height="65" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="205.0" y="385.5" text-anchor="middle">Layer</text><rect x="665" y="345" width="250" height="65" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="790.0" y="385.5" text-anchor="middle">Feature class</text><path d="M420 166L210 218" stroke="#151b35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M580 166L790 218" stroke="#151b35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M205 292L205 341" stroke="#151b35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M790 292L790 341" stroke="#151b35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M328 375L660 375" stroke="#151b35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="470" y="350" text-anchor="middle" class="small">references</text></svg>