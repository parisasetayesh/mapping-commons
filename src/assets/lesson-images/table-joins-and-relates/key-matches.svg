<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img"><title>One key can connect to more than one record</title><desc>Regions 01, 02 and 03 connect to services 01/A, 01/B, 02/C and 04/D. Region 01 has two matches, 02 has one, 03 has none, and service D is unmatched.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#151b35"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#151b35;font-size:22px}.small{font-size:18px}.title{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}</style><rect width="1000" height="460" fill="white"/><text x="35" y="52" class="title">One key can connect to more than one record</text><rect x="45" y="110" width="340" height="60" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="215.0" y="148.0" text-anchor="middle">Regions</text><rect x="595" y="110" width="350" height="60" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="770.0" y="148.0" text-anchor="middle">Services</text><text x="205" y="220" text-anchor="middle">01</text><text x="205" y="295" text-anchor="middle">02</text><text x="205" y="370" text-anchor="middle">03</text><text x="775" y="207" text-anchor="middle">01 / A</text><text x="775" y="265" text-anchor="middle">01 / B</text><text x="775" y="323" text-anchor="middle">02 / C</text><text x="775" y="381" text-anchor="middle">04 / D</text><path d="M245 212L680 200" stroke="#151b35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M245 212L680 258" stroke="#151b35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M245 287L680 316" stroke="#151b35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="35" y="438" class="small">Region 03 has no service match. Service D has no region match.</text></svg>