<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img"><title>One input can lead to different representations</title><desc>An elevation grid can produce slope and aspect values, hillshade as simulated illumination, or contour lines of equal elevation. Contours are line features rather than necessarily a raster.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#151b35"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#151b35;font-size:22px}.small{font-size:18px}.title{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}</style><rect width="1000" height="460" fill="white"/><text x="35" y="52" class="title">One input can lead to different representations</text><rect x="45" y="120" width="245" height="95" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="167.5" y="175.5" text-anchor="middle">Elevation grid</text><path d="M295 167L345 167" stroke="#151b35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="355" y="105" width="270" height="65" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="490.0" y="145.5" text-anchor="middle">Slope / Aspect</text><rect x="355" y="215" width="270" height="65" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="490.0" y="255.5" text-anchor="middle">Hillshade</text><rect x="355" y="325" width="270" height="65" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="490.0" y="365.5" text-anchor="middle">Contours</text><path d="M290 170L348 247" stroke="#151b35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M290 170L348 358" stroke="#151b35" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="670" y="146">Derived values</text><text x="670" y="255">Simulated light</text><text x="670" y="365">Equal-elevation lines</text></svg>