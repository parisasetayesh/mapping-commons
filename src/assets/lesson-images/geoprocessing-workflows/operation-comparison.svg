<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img"><title>Four operations, four different questions</title><desc>Buffer creates distance zones; Clip retains input inside a boundary; Dissolve groups features by shared values; Intersect retains shared overlap.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#151b35"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#151b35;font-size:22px}.small{font-size:18px}.title{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}</style><rect width="1000" height="460" fill="white"/><text x="35" y="52" class="title">Four operations, four different questions</text><rect x="35" y="105" width="435" height="125" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="252.5" y="175.5" text-anchor="middle">Buffer</text><text x="252" y="211" text-anchor="middle" class="small">Distance zone</text><rect x="525" y="105" width="435" height="125" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="742.5" y="175.5" text-anchor="middle">Clip</text><text x="742" y="211" text-anchor="middle" class="small">Retain inside boundary</text><rect x="35" y="275" width="435" height="125" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="252.5" y="345.5" text-anchor="middle">Dissolve</text><text x="252" y="381" text-anchor="middle" class="small">Group by shared values</text><rect x="525" y="275" width="435" height="125" fill="#eef3f8" stroke="#151b35" stroke-width="2"/><text x="742.5" y="345.5" text-anchor="middle">Intersect</text><text x="742" y="381" text-anchor="middle" class="small">Retain shared overlap</text></svg>