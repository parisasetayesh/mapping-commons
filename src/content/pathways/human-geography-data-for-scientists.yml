id: human-geography-data-for-scientists
title: "Demographic Data"
summary: "Learn how demographic data describes populations, choose meaningful geographic comparisons, and plan a clearly documented map."
audiences:
  - physical-scientists
  - environmental-scientists
  - interdisciplinary-research-teams
  - graduate-students
level: beginner
estimated_minutes: 420
outcome: "A demographic mapping plan that identifies the population, geography, comparison measure, uncertainty, and sources, with an introductory QGIS mapping exercise."

steps:
  - lesson: what-counts-as-a-map
    label: "Begin with what a map represents"
    required: true
    note: "Consider how a map can describe population patterns and what it cannot show about individual people."

  - lesson: map-purpose-and-technique
    label: "Choose a map type for your demographic question"
    required: true
    note: "Match the question and population measure to a suitable map type before choosing software."

  - lesson: human-geography-data-for-scientists
    label: "Understand how demographic data is produced"
    required: true
    note: "Distinguish measured environmental variables from estimates, classifications, administrative records, and survey data."

  - lesson: understand-geographic-units
    label: "Identify the geographic unit"
    required: true
    note: "Examine how tracts, ZIP codes, municipalities, service areas, and environmental boundaries differ."

  - lesson: census-acs-geography
    label: "Understand Census and ACS structures"
    required: true
    note: "Distinguish programs, estimates, boundaries, time periods, and uncertainty."

  - lesson: read-metadata-before-you-map
    label: "Read definitions and documentation"
    required: true
    note: "Confirm the population, denominator, collection method, field definition, and coverage."

  - lesson: counts-rates-normalization
    label: "Make fair comparisons"
    required: true
    note: "Choose counts, rates, percentages, densities, or standardized measures intentionally."

  - lesson: join-data-to-geography
    label: "Connect attributes to boundaries"
    required: true
    note: "Use identifiers such as GEOIDs and verify join coverage."

  - lesson: data-ownership-privacy-uncertainty
    label: "Document uncertainty and ethical limits"
    required: true
    note: "Record missingness, margins of error, privacy constraints, and representational consequences."

  - lesson: first-map-in-qgis
    label: "Practice building a first map"
    required: true
    note: "Use the supplied practice layer to learn the QGIS workflow, then identify how you would apply it to your documented demographic dataset."

  - lesson: cite-map-and-data
    label: "Make the demographic evidence traceable"
    required: true
    note: "Write a source note that identifies the population measure, data producer, geography, reference period, and limitations."
